<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Успешный экран оплаты — витамины (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1098D4;
  --blue-light:#63BCE3;
  --dark:#05131A;
  --muted:#8CA0AC;
  --bg:#ffffff;
  --accent-bg:#EDF8FC;
  --green:#27AE60;
  --error:#d10714;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Montserrat",Arial,Helvetica,sans-serif;
  font-size:14px;color:var(--dark);
  background:var(--bg);
  min-height:100vh;
}
button{font-family:inherit}
[hidden]{display:none !important}

.wrap{
  max-width:520px;margin:0 auto;
  padding:14px 20px calc(48px + env(safe-area-inset-bottom));
}

/* ---------- header ---------- */
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.hd .logo{height:19px;width:auto;fill:var(--blue);display:block}
.hd-right{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:46px;height:46px;border-radius:50%;background:#F2F4F6;border:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
}
.ava{
  width:46px;height:46px;border-radius:50%;background:#F2F4F6;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:500;color:var(--dark);
}
.badge{
  position:absolute;top:-2px;right:-2px;
  min-width:20px;height:20px;border-radius:10px;padding:0 6px;
  background:var(--blue);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;
}
.badge.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* ---------- paid pill ---------- */
.paid{
  display:flex;align-items:center;gap:14px;
  background:#F2F4F6;border-radius:40px;
  padding:10px 12px 10px 26px;
  width:fit-content;margin:0 auto 30px;
  font-size:16px;font-weight:500;
}
.paid .tick{
  width:34px;height:34px;border-radius:50%;background:var(--green);flex:none;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- заголовок ---------- */
h1{font-size:23px;font-weight:600;line-height:1.28;text-align:center;margin-bottom:10px}
.lead{font-size:15px;line-height:1.45;text-align:center;color:#4a5a65;margin-bottom:26px}

/* ---------- primary CTA ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;border:0;border-radius:14px;padding:17px 20px;
  font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));
  cursor:pointer;transition:opacity .15s,box-shadow .25s;
}
.btn:active{opacity:.85}
.btn:disabled{background:#d4dfe6;color:#93a5b1;cursor:default}
.cta-book{font-size:16px;padding:18px 20px}
.cta-book.nudge{animation:nudge 1.1s ease}
@keyframes nudge{
  0%,100%{box-shadow:0 0 0 0 rgba(16,152,212,0)}
  30%{box-shadow:0 0 0 7px rgba(16,152,212,.22)}
  60%{box-shadow:0 0 0 3px rgba(16,152,212,.12)}
}

/* ---------- showcase ---------- */
.recs{background:var(--accent-bg);border-radius:18px;padding:16px 14px;margin:22px 0}
.recs-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.recs-head h3{font-size:15px;font-weight:600;white-space:nowrap}
.recs-link{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;white-space:nowrap;flex:none}
.rail{
  display:flex;gap:8px;overflow-x:auto;
  scroll-snap-type:x mandatory;
  margin:0 -14px;padding:0 14px 4px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.p-card{
  width:190px;flex:none;background:#fff;border-radius:14px;padding:12px 12px 14px;
  scroll-snap-align:start;display:flex;flex-direction:column;
}
.p-img{
  height:132px;border-radius:12px;background:#F4F6F8;
  display:flex;align-items:center;justify-content:center;
}
.p-img svg{height:106px;width:auto}
.p-name{font-size:13.5px;font-weight:600;line-height:1.3;margin:11px 0 0;min-height:35px}
.p-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:6px}
.p-pricecol{min-width:0}
.p-price{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap}
.p-caps{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
/* кнопка добавления намеренно легче основного действия экрана */
.round-btn{
  width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;
  background:#fff;border:1.5px solid var(--blue);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s;
}
.round-btn:active{transform:scale(.9)}
.stepper-s{
  display:flex;align-items:center;justify-content:space-between;
  height:34px;width:82px;flex:none;
  border:1.5px solid #CFE5F2;border-radius:17px;background:#fff;
}
.stepper-s button{width:26px;height:100%;border:0;background:none;font-size:16px;font-weight:600;color:var(--blue);cursor:pointer}
.stepper-s span{flex:1;text-align:center;font-size:13px;font-weight:700}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:85;
  max-width:496px;margin:0 auto;
  background:var(--dark);color:#fff;border-radius:14px;
  display:flex;align-items:center;gap:10px;
  padding:13px 15px;font-size:13px;font-weight:500;
  box-shadow:0 8px 28px rgba(5,19,26,.35);
  transform:translateY(16px);opacity:0;pointer-events:none;
  transition:transform .25s,opacity .25s;
}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .t-im{
  flex:none;width:30px;height:38px;border-radius:7px;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
}
.toast .t-im svg{height:32px;width:auto}
.toast .t-txt{flex:1;line-height:1.4}
.toast button{border:0;background:none;color:var(--blue-light);font-size:13px;font-weight:700;cursor:pointer;padding:4px 2px;white-space:nowrap}

/* ---------- cart (мок) ---------- */
.cart{position:fixed;inset:0;z-index:60;background:#F1F4F6;overflow-y:auto}
.cart-inner{max-width:520px;margin:0 auto;padding:20px 16px 60px}
.cart-back{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:500;color:var(--blue);
  background:none;border:0;cursor:pointer;padding:6px 0;margin-bottom:8px;
}
.cart h2{font-size:24px;font-weight:600;margin-bottom:18px}
.cart-item{
  background:#fff;border-radius:16px;padding:16px;
  display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;
}
.cart-item .ci-im{flex:none;width:52px;height:66px;background:#F4F6F8;border-radius:10px;display:flex;align-items:center;justify-content:center}
.cart-item .ci-im svg{height:54px;width:auto}
.cart-item .ci-info{flex:1;min-width:0}
.ci-name{font-size:14px;font-weight:600;line-height:1.35}
.ci-caps{font-size:12px;color:var(--muted);margin-top:2px}
.ci-src{
  display:inline-block;font-size:11px;font-weight:600;color:var(--blue);
  background:var(--accent-bg);border-radius:6px;padding:3px 8px;margin-top:6px;
}
.ci-qty{font-size:12.5px;color:var(--muted);margin-top:6px}
.ci-price{font-size:14px;font-weight:600;white-space:nowrap}
.cart-sum{background:#fff;border-radius:16px;padding:16px;margin-top:14px}
.cart-sum h3{font-size:14.5px;font-weight:600;margin-bottom:10px}
.cs-row{display:flex;justify-content:space-between;font-size:13px;color:#5c6d78;margin-bottom:7px}
.cs-row:last-child{margin-bottom:0}
.cart-total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:16px 4px 14px;font-size:15px;
}
.cart-total b{font-size:20px;font-weight:700}

/* ---------- proto panel ---------- */
.fab{
  position:fixed;right:14px;bottom:20px;z-index:70;
  background:var(--dark);color:#fff;border:0;border-radius:24px;
  padding:11px 16px;font-size:12.5px;font-weight:600;
  cursor:pointer;box-shadow:0 6px 18px rgba(5,19,26,.3);
}
.panel{
  position:fixed;right:14px;bottom:70px;z-index:70;
  width:300px;max-width:calc(100vw - 28px);
  max-height:calc(100vh - 130px);overflow-y:auto;
  background:#fff;border-radius:16px;
  box-shadow:0 10px 40px rgba(5,19,26,.25);
  padding:18px;display:none;
}
.panel.open{display:block}
.panel h4{font-size:13px;font-weight:700;margin-bottom:10px}
.panel .grp{margin-bottom:16px}
.panel .grp:last-child{margin-bottom:0}
.panel label{
  display:flex;align-items:flex-start;gap:9px;
  font-size:12.5px;line-height:1.4;padding:7px 8px;border-radius:10px;cursor:pointer;
}
.panel label:hover{background:#F3F6F9}
.panel input{accent-color:var(--blue);margin-top:2px;flex:none}
.panel label.sel{background:var(--accent-bg);font-weight:600}

/* ---------- мобильная версия ---------- */
@media(max-width:480px){
  .wrap{padding:10px 16px calc(32px + env(safe-area-inset-bottom))}
  .hd{margin-bottom:18px}
  .icon-btn,.ava{width:42px;height:42px}
  .hd .logo{height:17px}
  .paid{font-size:15px;padding:8px 10px 8px 22px;gap:12px;margin-bottom:24px}
  .paid .tick{width:30px;height:30px}
  h1{font-size:21px;margin-bottom:8px}
  .lead{font-size:14px;margin-bottom:20px}
  .cta-book{font-size:15px;padding:16px 18px}

  .recs{margin:18px 0 0;padding:14px 12px;border-radius:16px}
  .recs-head{margin-bottom:10px}
  .recs-head h3{font-size:14.5px}
  /* карусель выходит за края блока — видно, что список продолжается */
  .rail{margin:0 -12px;padding:0 12px 4px;gap:8px}
  .p-card{width:152px;padding:10px 10px 12px;border-radius:12px}
  .p-img{height:104px;border-radius:10px}
  .p-img svg{height:86px}
  .p-name{font-size:12.5px;margin-top:9px;min-height:32px}
  .p-row{margin-top:5px;gap:6px}
  .p-price{font-size:13.5px}
  .p-caps{font-size:10.5px}
  .round-btn{width:32px;height:32px}
  .stepper-s{width:66px;height:32px;border-radius:16px}
  .stepper-s button{width:21px;font-size:15px}
  .stepper-s span{font-size:12.5px}
}
/* низкие экраны — плотнее по вертикали */
@media(max-height:700px){
  .paid{margin-bottom:18px}
  .lead{margin-bottom:16px}
  .recs{margin-top:14px}
}
</style>
</head>

  <header class="hd">
    <svg class="logo" viewBox="0 0 299.6 82.4" width="106"><use href="#wm"/></svg>
    <div class="hd-right">
      <button class="icon-btn" id="cartBtn" aria-label="Корзина">
        <svg width="21" height="21" viewBox="0 0 20 20" fill="none"><path d="M3 3h2l1.6 9.2a1.6 1.6 0 0 0 1.58 1.3h6.9a1.6 1.6 0 0 0 1.56-1.22L18.4 6H5.5" stroke="#05131A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="17" r="1.3" fill="#05131A"/><circle cx="14.6" cy="17" r="1.3" fill="#05131A"/></svg>
        <span class="badge" id="cartBadge" hidden>0</span>
      </button>
      <div class="ava">ИИ</div>
    </div>
  </header>

  <div class="paid">
    Оплата прошла
    <span class="tick">
      <svg width="16" height="13" viewBox="0 0 24 20" fill="none"><path d="M2 10.5l7 7L22 2.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </div>

  <h1>Следующий шаг — сдача крови</h1>
  <p class="lead">Вы можете сдать дома или в офисе в удобное для себя время</p>

  <div id="slotAbove"></div>

  <button class="btn cta-book" id="ctaBook">Записаться в Лабораторию</button>

  <div id="slotBelow"></div>
</div>

<!-- тост-подтверждение -->
<div class="toast" id="toast">
  <span class="t-im" id="toastIm"></span>
  <span class="t-txt" id="toastTxt"></span>
  <button id="toastBtn">В корзину</button>
</div>

<!-- корзина (мок) -->
<div class="cart" id="cart" hidden>
  <div class="cart-inner">
    <button class="cart-back" id="cartBack">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M6 1L1 6l5 5M1 6h12" stroke="#1098D4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Вернуться
    </button>
    <h2>Корзина</h2>
    <div id="cartItems"></div>
    <div class="cart-sum">
      <h3>Сумма заказа</h3>
      <div class="cs-row"><span>Товары</span><span id="cartGoods">0 ₽</span></div>
      <div class="cs-row"><span>Доставка</span><span>Рассчитаем позже</span></div>
    </div>
    <div class="cart-total"><span>К оплате</span><b id="cartTotal">0 ₽</b></div>
    <button class="btn">Оформить заказ</button>
  </div>
</div>

<!-- панель прототипа -->
<button class="fab" id="fab">Настройки прототипа</button>
<div class="panel" id="panel">
  <div class="grp">
    <h4>Размещение блока</h4>
    <div id="grpPlace"></div>
  </div>
  <div class="grp">
    <h4>Состояние</h4>
    <div id="grpState"></div>
  </div>
</div>

<script>
/* набор намеренно отличается от экрана записи — клиент не должен
   увидеть одни и те же позиции дважды за несколько минут (требование 5) */
const PRODUCTS = [
  {id:'immun',  name:'Иммунитет',           price:2390, caps:'60 капсул'},
  {id:'energy', name:'Энергия и тонус',     price:2690, caps:'60 капсул'},
  {id:'beauty', name:'Красота и волосы',    price:3190, caps:'60 капсул'},
  {id:'gut',    name:'Здоровье кишечника',  price:2590, caps:'60 капсул'},
  {id:'joint',  name:'Суставы и связки',    price:2790, caps:'60 капсул'},
  {id:'detox',  name:'Детокс и печень',     price:2290, caps:'60 капсул'},
];

const PLACES = [
  {id:'below', label:'Ниже кнопки записи — кнопка не сдвигается'},
  {id:'above', label:'Выше кнопки записи'},
];
const STATES = [
  {id:1, label:'Блок с товарами, корзина пуста'},
  {id:2, label:'Товар добавлен, подтверждение'},
  {id:3, label:'Позиция уже в корзине'},
];

let place = 'below';
let state = 1;
let cart = {};
let toastTimer = null;

const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
function plural(n, forms){
  return n%10===1 && n%100!==11 ? forms[0]
    : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20) ? forms[1] : forms[2]);
}
function bottleSVG(){
  return `<svg viewBox="0 0 64 84" fill="none">
    <rect x="19" y="4" width="26" height="11" rx="3" fill="#D5DADF"/>
    <rect x="19" y="4" width="26" height="4" rx="2" fill="#E9EDF0"/>
    <rect x="22" y="15" width="20" height="4" fill="#3B2B1F"/>
    <rect x="14" y="18" width="36" height="62" rx="9" fill="#4E3A2A"/>
    <rect x="18" y="23" width="5" height="52" rx="2.5" fill="#6B5340" opacity=".55"/>
    <rect x="14" y="36" width="36" height="27" fill="#221A13"/>
    <text x="32" y="52" text-anchor="middle" font-family="Montserrat,Arial" font-size="8.5" font-weight="600" fill="#fff">bioniq</text>
  </svg>`;
}

function cartCount(){ return Object.values(cart).reduce((s,q)=>s+q,0); }
function cartTotal(){
  return Object.entries(cart).reduce((s,[id,q])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    return s + p.price*q;
  },0);
}

/* ---------- витрина ---------- */
function render(){
  document.getElementById('slotAbove').innerHTML='';
  document.getElementById('slotBelow').innerHTML='';
  const slot = document.getElementById(place==='above'?'slotAbove':'slotBelow');
  slot.appendChild(buildRecs());
  updateBadge();
}

function buildRecs(){
  const el = document.createElement('section');
  el.className='recs';
  let html = `<div class="recs-head"><h3>Рекомендации к покупке</h3><a class="recs-link" href="#">Все витамины</a></div>
    <div class="rail">`;
  for(const p of PRODUCTS){
    const q = cart[p.id]||0;
    const control = q===0
      ? `<button class="round-btn" data-add="${p.id}" aria-label="В корзину">
           <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2v11M2 7.5h11" stroke="#1098D4" stroke-width="1.9" stroke-linecap="round"/></svg>
         </button>`
      : `<div class="stepper-s" data-id="${p.id}">
           <button data-dec="${p.id}">−</button><span>${q}</span><button data-inc="${p.id}">+</button>
         </div>`;
    html += `<div class="p-card">
      <div class="p-img">${bottleSVG()}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-row">
        <div class="p-pricecol"><div class="p-price">${fmt(p.price)}</div><div class="p-caps">${p.caps}</div></div>
        ${control}
      </div>
    </div>`;
  }
  html += `</div>`;
  el.innerHTML = html;

  el.querySelectorAll('[data-add]').forEach(b=>{
    b.addEventListener('click',()=>addToCart(b.dataset.add));
  });
  el.querySelectorAll('[data-inc]').forEach(b=>{
    b.addEventListener('click',()=>{ cart[b.dataset.inc]++; afterChange(b.dataset.inc,true); });
  });
  el.querySelectorAll('[data-dec]').forEach(b=>{
    b.addEventListener('click',()=>{
      const id = b.dataset.dec;
      cart[id]--;
      if(cart[id]<=0) delete cart[id];
      afterChange(id,false);
    });
  });
  return el;
}

function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  render();
  confirmAdd(id);
}
function afterChange(id, grew){
  render();
  popBadge();
  if(grew && cart[id]) showToast(id);
  if(!cart[id]) hideToast();
}
function confirmAdd(id){
  popBadge();
  showToast(id);
  nudgeBooking();   // напоминаем, что основное действие — запись
}

/* ---------- основное действие экрана ---------- */
function nudgeBooking(){
  const b = document.getElementById('ctaBook');
  b.classList.remove('nudge');
  void b.offsetWidth;
  b.classList.add('nudge');
}
document.getElementById('ctaBook').addEventListener('click', ()=>{
  alert('Переход к записи в лабораторию — основной сценарий экрана');
});

/* ---------- тост ---------- */
function showToast(id){
  const p = PRODUCTS.find(x=>x.id===id);
  const q = cart[id];
  document.getElementById('toastIm').innerHTML = bottleSVG();
  document.getElementById('toastTxt').textContent =
    q>1 ? `${p.name} — в корзине, ${q} ${plural(q,['упаковка','упаковки','упаковок'])}`
        : `${p.name} — в корзине`;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3500);
}
function hideToast(){
  document.getElementById('toast').classList.remove('show');
  clearTimeout(toastTimer);
}
document.getElementById('toastBtn').addEventListener('click', ()=>{ hideToast(); openCart(); });

/* ---------- бейдж и корзина ---------- */
function updateBadge(){
  const b = document.getElementById('cartBadge');
  const n = cartCount();
  b.hidden = n===0;
  b.textContent = n;
}
function popBadge(){
  const b = document.getElementById('cartBadge');
  b.classList.remove('pop');
  void b.offsetWidth;
  b.classList.add('pop');
}
function openCart(){
  hideToast();
  const wrap = document.getElementById('cartItems');
  const rows = Object.entries(cart).map(([id,q])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    return `<div class="cart-item">
      <div class="ci-im">${bottleSVG()}</div>
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-caps">${p.caps}</div>
        <span class="ci-src">Источник: успешный экран оплаты</span>
        <div class="ci-qty">${q} ${plural(q,['упаковка','упаковки','упаковок'])}${q>1?` × ${fmt(p.price)}`:''}</div>
      </div>
      <div class="ci-price">${fmt(p.price*q)}</div>
    </div>`;
  });
  wrap.innerHTML = rows.join('') || '<p style="color:#8CA0AC;font-size:13.5px">Корзина пуста</p>';
  document.getElementById('cartGoods').textContent = fmt(cartTotal());
  document.getElementById('cartTotal').textContent = fmt(cartTotal());
  document.getElementById('cart').hidden = false;
  document.body.style.overflow = 'hidden';
}
document.getElementById('cartBack').addEventListener('click', ()=>{
  document.getElementById('cart').hidden = true;
  document.body.style.overflow = '';
});
document.getElementById('cartBtn').addEventListener('click', openCart);

/* ---------- состояния ---------- */
function applyState(){
  cart = {};
  hideToast();
  if(state===2){ cart = {energy:1}; }
  if(state===3){ cart = {immun:1}; }
  render();
  if(state===2) confirmAdd('energy');
}

/* ---------- панель ---------- */
const fab = document.getElementById('fab');
const panel = document.getElementById('panel');
fab.addEventListener('click',()=>panel.classList.toggle('open'));

function radios(containerId, list, current, onPick){
  const c = document.getElementById(containerId);
  c.innerHTML='';
  for(const it of list){
    const l = document.createElement('label');
    if(String(it.id)===String(current)) l.className='sel';
    l.innerHTML = `<input type="radio" name="${containerId}" ${String(it.id)===String(current)?'checked':''}> ${it.label}`;
    l.querySelector('input').addEventListener('change',()=>onPick(it.id));
    c.appendChild(l);
  }
}
function checkboxes(containerId, list, stateObj, onPick){
  const c = document.getElementById(containerId);
  c.innerHTML='';
  for(const it of list){
    const l = document.createElement('label');
    if(stateObj[it.id]) l.className='sel';
    l.innerHTML = `<input type="checkbox" ${stateObj[it.id]?'checked':''}> ${it.label}`;
    l.querySelector('input').addEventListener('change',e=>onPick(it.id, e.target.checked));
    c.appendChild(l);
  }
}
function renderPanel(){
  radios('grpPlace', PLACES, place, id=>{place=id; renderPanel(); render();});
  radios('grpState', STATES, state, id=>{state=id; renderPanel(); applyState();});
}

/* init */
renderPanel();
applyState();
if(window.innerWidth>900) panel.classList.add('open');
</script>
</body>
</html>
